name: Test and Run Ikabot

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:

    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ endsWith(matrix.python-version, '-dev') }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      if: "!endsWith(matrix.python-version, '-dev')"
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up Python ${{ matrix.python-version }}
      uses: deadsnakes/action@v1.0.0
      if: endsWith(matrix.python-version, '-dev')
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .
    - name: Install Test Dependencies
      run: |
        pip install pytest
        pip install pytest-mock
    - name: Run Tests
      run: |
        python -m pytest tests/ikabot
    - name: Run ikabot
      shell: bash
      run: |
        # getpass reads the Windows console instead of stdin, so make it read the piped input
        printf "\n\n\n" | python -c "import getpass, runpy, sys; getpass.getpass = lambda prompt='Password: ', stream=None: input(prompt); sys.argv = ['ikabot']; runpy.run_module('ikabot', run_name='__main__', alter_sys=True)" &> log.log || cat log.log
        grep "Obtaining new blackbox token, please wait..." log.log && exit 0 || exit 1
